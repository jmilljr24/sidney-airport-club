name: Convert Minutes PR Workflow

permissions:
  contents: write

# Trigger on PRs that modify .docx files
on:
  pull_request:
    paths:
      - "_minutes/**.docx"

jobs:
  convert_minutes:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the pull request branch
      - name: Checkout PR branch
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}

      # 2. Install Pandoc
      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      # 3. Convert DOCX to Markdown and update the matching meeting file
      - name: Convert DOCX to Markdown and update meetings
        run: |
          mkdir -p _includes/minutes
          mkdir -p _meetings
          for file in _minutes/*.docx; do
            # Strip the .docx extension
            filename=$(basename "$file" .docx)

            # Normalize the name to YYYY-MM-DD (underscores or compact dates are converted)
            normalized=$(echo "$filename" | tr '_' '-')
            if [[ "$normalized" =~ ^([0-9]{4})([0-9]{2})([0-9]{2})$ ]]; then
              normalized="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}-${BASH_REMATCH[3]}"
            fi

            markdown_file="_includes/minutes/${normalized}.md"
            meeting_file="_meetings/${normalized}.md"

            echo "Converting $file → $markdown_file"
            pandoc "$file" -f docx -t gfm -o "$markdown_file"

            # Create or update the meeting file, preserving any existing content
            existing_content=""
            if [ -f "$meeting_file" ]; then
              existing_content=$(sed '1,/^---$/d' "$meeting_file")
            fi

            {
              echo "---"
              echo "date: ${normalized}"
              echo "minutes_include: /minutes/${normalized}.md"
              echo "---"
              echo "$existing_content"
            } > "$meeting_file"

            # Keep a single source docx per meeting date (rename to normalized name)
            if [ "$filename" != "$normalized" ]; then
              target="_minutes/${normalized}.docx"
              if [ -f "$target" ]; then
                echo "Removing duplicate source $file (${normalized}.docx already exists)"
                rm "$file"
              else
                mv "$file" "$target"
              fi
            fi
          done

      # 4. Commit changes back to the PR branch
      - name: Commit changes to PR branch
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add new converted minutes and meeting files"
          branch: ${{ github.head_ref }}
